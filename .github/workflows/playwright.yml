name: Playwright Automation Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    schedule:
      - cron: '30 18 * * *'   # 12:00 AM IST daily
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (required for Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx --no-install playwright install --with-deps

      - name: Start Application Server
        run: npm run start > app.log 2>&1 &

      - name: Wait for Application
        run: npx wait-on http://localhost:8888 --timeout 60000

      - name: Show Application Log on Failure
        if: failure()
        run: cat app.log

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Generate Allure Report
        if: always()
        run: npx allure-commandline generate ./allure-results --clean -o ./allure-report

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/