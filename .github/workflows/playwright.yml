name: Playwright Automation Test

on:

  # Run when code is pushed to main
  push:
    branches:
      - main

  # Run when Pull Request is created/updated
  pull_request:
    branches:
      - main

  # Run every day at 12:00 AM IST
  # 12:00 AM IST = 18:30 UTC
  schedule:
    - cron: '30 18 * * *'

  # Manual run from GitHub Actions
  workflow_dispatch:


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      # 1. Get project code
      - name: Checkout Code
        uses: actions/checkout@v4


      # 2. Install Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      # 3. Install npm packages
      - name: Install Dependencies
        run: npm ci


      # 4. Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx --no-install playwright install --with-deps


      # 5. Start Application Server
      - name: Start Application Server
        run: npm run start > app.log 2>&1 &


      # 6. Check application startup log
      - name: Check Application Log
        run: |
          sleep 10
          cat app.log


      # 7. Wait until application is available
      - name: Wait for Application
        run: npx wait-on http://localhost:8888 --timeout 60000


      # 8. Run Playwright tests
      - name: Run Playwright Tests
        run: npx playwright test


      # 9. Upload Playwright HTML Report
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/


      # 10. Upload test results
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/